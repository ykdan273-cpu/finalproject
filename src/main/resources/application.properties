spring.application.name=vacancy-parser
server.port=8080

# User-Agent (какой видит целевой сайт)
vacancy.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36

vacancy.demo-urls=
vacancy.scheduler.delay=60000

# H2 database configuration
spring.datasource.url=jdbc:h2:file:./data/vacancies-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
