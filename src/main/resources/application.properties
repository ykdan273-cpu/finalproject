spring.application.name=vacancy-parser
server.port=8080

# User-Agent (какой видит целевой сайт)
vacancy.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36

vacancy.demo-urls=
vacancy.scheduler.delay=60000
vacancy.frontend.default-delay-ms=0

# H2 database configuration
spring.datasource.url=${VACANCY_DB_URL:jdbc:h2:file:./data/vacancies-db}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=vacancy-parser

# Log encoding
logging.charset.console=UTF-8
logging.charset.file=UTF-8
