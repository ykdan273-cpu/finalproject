spring.application.name=vacancy-parser
server.port=8080
vacancy.storage.backend=${VACANCY_STORAGE_BACKEND:jpa}

# User-Agent (какой видит целевой сайт)
vacancy.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36

vacancy.demo-urls=
vacancy.scheduler.delay=60000
vacancy.frontend.default-delay-ms=0

# Cache configuration (switch caffeine -> redis via spring.cache.type)
spring.cache.type=caffeine
spring.cache.cache-names=vacancies
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# MongoDB configuration (used when vacancy.storage.backend=mongo)
spring.data.mongodb.uri=${VACANCY_MONGO_URI:mongodb://localhost:27017/vacancies}
spring.data.mongodb.database=${VACANCY_MONGO_DB:vacancies}

# H2 database configuration
spring.datasource.url=${VACANCY_DB_URL:jdbc:h2:file:./data/vacancies-db;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=vacancy-parser

# Log encoding
logging.charset.console=UTF-8
logging.charset.file=UTF-8
