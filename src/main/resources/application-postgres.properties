spring.datasource.url=${VACANCY_DB_URL:jdbc:postgresql://localhost:5432/vacancies}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${VACANCY_DB_USER:vacancy}
spring.datasource.password=${VACANCY_DB_PASSWORD:vacancy}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
vacancy.storage.backend=jpa
