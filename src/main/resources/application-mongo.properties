vacancy.storage.backend=mongo

# Mongo connection (override VACANCY_MONGO_URI to point at your instance)
spring.data.mongodb.uri=${VACANCY_MONGO_URI:mongodb://localhost:27017/vacancies}
spring.data.mongodb.database=${VACANCY_MONGO_DB:vacancies}

# Lightweight relational datasource so Spring Data JPA context can start alongside Mongo
spring.datasource.url=${VACANCY_DB_URL:jdbc:h2:mem:vacancies-mongo;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
